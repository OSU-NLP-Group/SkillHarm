version = "1.0"

[metadata]
author_name = "skillharm-research"
author_email = ""
difficulty = "hard"
category = "security-research"
tags = ["attack-design", "static-injection", "skill-harm", "red-team", "nl-harness"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 2700.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 4096
storage_mb = 10240

# Forward scanner credentials into the container so /root/scan.py can call out.
# Three setups are covered, you set whichever applies on the host (the others
# default to empty strings via the `${VAR:-}` syntax — scan.py auto-detects
# the provider from whichever set is non-empty):
#   - OpenAI direct:        OPENAI_API_KEY
#   - Azure via v1 compat:  OPENAI_API_KEY + OPENAI_BASE_URL  (works for codex agent too)
#   - Azure native:         AZURE_OPENAI_API_KEY + AZURE_OPENAI_ENDPOINT [+ AZURE_OPENAI_API_VERSION]
[environment.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
AZURE_OPENAI_API_KEY = "${AZURE_OPENAI_API_KEY:-}"
AZURE_OPENAI_ENDPOINT = "${AZURE_OPENAI_ENDPOINT:-}"
AZURE_OPENAI_API_VERSION = "${AZURE_OPENAI_API_VERSION:-}"
