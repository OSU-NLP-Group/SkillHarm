version = "1.0"

[metadata]
author_name = "skillharm-research"
author_email = ""
difficulty = "medium"
category = "security-research"
tags = ["attack-filter", "quality-assessment", "skill-harm", "static-injection"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 5120

# Identity (task_id / risk_id / target_slug / design_agent_id) is staged into
# the container as /root/identity.json by prepare_filter_context.py — the
# agent reads that file rather than env vars, which proved unreliable.
